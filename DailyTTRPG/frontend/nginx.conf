server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /privacy {
    try_files /privacy/index.html =404;
  }

  location = /terms {
    try_files /terms/index.html =404;
  }

  location = /sms-terms {
    try_files /sms-terms/index.html =404;
  }

  location = /dev/sms-simulator {
    try_files /dev/sms-simulator/index.html =404;
  }

  location = /play {
    try_files /play/index.html =404;
  }

  location /play/ {
    try_files $uri $uri/ /play/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
