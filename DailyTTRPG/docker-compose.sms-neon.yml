services:
  backend:
    build:
      context: ./backend
    container_name: dailyrpg-sms-neon-backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      ENABLE_SMS_SIMULATOR: true
      SMS_SIMULATOR_DEV_PASSWORD: ${SMS_SIMULATOR_DEV_PASSWORD:-}
      SMS_ONBOARDING_RESUME_HOURS: ${SMS_ONBOARDING_RESUME_HOURS:-48}
    volumes:
      - ./content:/app/content:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: dailyrpg-sms-neon-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/dev/sms-simulator || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
